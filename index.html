<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Patterns Set 3B Matching Quiz</title>

<style>

:root{
  --ncs-purple:#5B2C83;
  --ncs-purple-dark:#442061;
  --ncs-gold:#E5B223;
  --ncs-gold-light:#F2CC59;

  --bg:#faf8fc;
  --card:#ffffff;
  --border:#e7deef;
  --muted:#6e5d7d;

  --danger:#b00020;
  --ok:#0b6;

  --gap:14px;
  --radius:14px;
  --shadow:0 8px 20px rgba(91,44,131,.10);
}

*{
  box-sizing:border-box;
}

body{
  font-family: ui-sans-serif, system-ui, sans-serif;
  margin:0;
  padding:18px;

  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(229,178,35,.20), transparent 60%),
    radial-gradient(900px 500px at 90% -20%, rgba(91,44,131,.16), transparent 55%),
    var(--bg);

  color:#111827;
}

.shell{
  max-width:1200px;
  margin:0 auto;
}

.brandbar{
  display:flex;
  align-items:center;
  gap:12px;

  padding:14px 16px;
  border-radius:14px;

  background:linear-gradient(
    90deg,
    var(--ncs-purple),
    var(--ncs-purple-dark)
  );

  color:#fff;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.crest{
  width:44px;
  height:44px;
  border-radius:12px;

  background:linear-gradient(
    135deg,
    var(--ncs-gold),
    var(--ncs-gold-light)
  );

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:800;
  color:#4a2b00;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.hidden{
  display:none;
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
}

.field{
  flex:1;
  min-width:220px;

  display:flex;
  flex-direction:column;
  gap:6px;
}

label{
  font-size:12px;
  color:var(--muted);
}

input,
select{
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  font-size:14px;
}

button{
  padding:12px 16px;
  border:none;
  border-radius:12px;
  cursor:pointer;

  font-weight:700;
  font-size:14px;

  background:var(--ncs-purple);
  color:#fff;
}

button.secondary{
  background:#fff;
  color:var(--ncs-purple);
  border:1px solid var(--border);
}

.playBtn{
  background:linear-gradient(
    135deg,
    var(--ncs-gold),
    var(--ncs-gold-light)
  );

  color:#4a2b00;
}

.topActions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.pill{
  padding:6px 10px;
  border-radius:999px;

  background:rgba(229,178,35,.18);
  border:1px solid rgba(229,178,35,.35);

  font-size:12px;
  font-weight:700;
}

.divider{
  height:1px;
  background:var(--border);
  margin:18px 0;
}

.q{
  border-top:1px solid var(--border);
  padding-top:18px;
  margin-top:18px;
}

.choices{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:18px;
  margin-top:18px;
}

.choice{
  position:relative;

  border:1px solid var(--border);
  border-radius:18px;

  padding:12px;

  background:#fff;
  cursor:pointer;

  transition:.12s ease;
}

.choice:hover{
  transform:translateY(-2px);
}

.choice.selected{
  border-color:rgba(91,44,131,.5);
  box-shadow:0 0 0 4px rgba(91,44,131,.10);
}

.choice input{
  display:none;
}

.choice img{
  width:100%;
  max-width:420px;
  display:block;
  border-radius:12px;
}

.status{
  margin-top:12px;
  font-size:14px;
}

.status.ok{
  color:var(--ok);
}

.status.err{
  color:var(--danger);
}

/* REVIEW */

.reviewCorrect{
  border:3px solid #22c55e !important;
}

.reviewIncorrect{
  border:3px solid #ef4444 !important;
}

.correctBadge,
.incorrectBadge{
  position:absolute;
  top:12px;
  right:12px;

  width:36px;
  height:36px;
  border-radius:999px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
  font-weight:800;
  color:#fff;
}

.correctBadge{
  background:#22c55e;
}

.incorrectBadge{
  background:#ef4444;
}

</style>
</head>

<body>

<div class="shell">

<div class="brandbar">

  <div class="crest">NCS</div>

  <div>
    <div style="font-size:12px;opacity:.85;">
      National Cathedral School
    </div>

    <div style="font-weight:bold;">
      Patterns — Set 3B Matching Quiz
    </div>
  </div>

</div>

<!-- INTRO -->

<div id="introCard" class="card">

<h2>Welcome</h2>

<div style="color:#6e5d7d;font-size:14px;">
Listen to each example and choose the matching image.
</div>

<div style="height:14px;"></div>

<form id="introForm">

<div class="row">

<div class="field">
<label>First Name</label>
<input id="firstName" type="text" required />
</div>

<div class="field">
<label>Last Name</label>
<input id="lastName" type="text" required />
</div>

<div class="field">
<label>Email</label>
<input id="email" type="email" required />
</div>

<div class="field">
<label>Grade / Section</label>

<select id="gradeSection" required>
<option value="" selected disabled>Select…</option>
<option value="4WY">4WY</option>
<option value="4XZ">4XZ</option>
<option value="5A">5A</option>
<option value="5B">5B</option>
<option value="5C">5C</option>
</select>

</div>

</div>

<div class="divider"></div>

<div class="topActions">

<button id="startBtn" type="submit">
Start Quiz
</button>

<span class="pill">
8 Questions
</span>

</div>

<div id="introStatus" class="status"></div>

</form>

</div>

<!-- QUIZ -->

<div id="quizCard" class="card hidden">

<div class="topActions">

<h2 style="margin-right:auto;">Quiz</h2>

<button id="resetBtn" class="secondary" type="button">
Start Over
</button>

</div>

<div id="questions"></div>

<div class="divider"></div>

<div class="topActions">

<button id="submitBtn" type="button">
Submit
</button>

<span id="scorePreview"></span>

</div>

<div id="submitStatus" class="status"></div>

</div>

</div>

<script>

const GOOGLE_APPS_SCRIPT_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbyxZSjQrDuA9Uu3G3yx5X8Vl3lNcgFIDMmcMVos9pB66LKuiJTX6X3_rXRgkDpQfWc6/exec";

const FILES = {

  "audio/3b.1.mp3":"https://dl.dropboxusercontent.com/scl/fi/swufkev1pa5pc0drogcl9/3b.1.mp3",
  "audio/3b.2.mp3":"https://dl.dropboxusercontent.com/scl/fi/8sscdaw5smj1275088edq/3b.2.mp3",
  "audio/3b.3.mp3":"https://dl.dropboxusercontent.com/scl/fi/jp844ubmmcj84wqo1b6bn/3b.3.mp3",
  "audio/3b.4.mp3":"https://dl.dropboxusercontent.com/scl/fi/f411tt42aim4xcicgqb7i/3b.4.mp3",
  "audio/3b.5.mp3":"https://dl.dropboxusercontent.com/scl/fi/3tq3vpc2mk12ihug9twia/3b.5.mp3",
  "audio/3b.6.mp3":"https://dl.dropboxusercontent.com/scl/fi/kpacp1h4z9f4k7b9mi4v1/3b.6.mp3",
  "audio/3b.7.mp3":"https://dl.dropboxusercontent.com/scl/fi/62mwusdszmp6uyorno2y5/3b.7.mp3",
  "audio/3b.8.mp3":"https://dl.dropboxusercontent.com/scl/fi/6522pzyoesu926ebqc73v/3b.8.mp3",

  "img/3b.1.png":"https://dl.dropboxusercontent.com/scl/fi/u3pbia8o838tb9qn5v73s/3b.1.png",
  "img/3b.2.png":"https://dl.dropboxusercontent.com/scl/fi/rwbt63vrv5oi9qvp9n4zy/3b.2.png",
  "img/3b.3.png":"https://dl.dropboxusercontent.com/scl/fi/oycyt4lj62jjq9tyhprr7/3b.3.png",
  "img/3b.4.png":"https://dl.dropboxusercontent.com/scl/fi/gb0nd0zjwtx74w0h2wrop/3b.4.png",
  "img/3b.5.png":"https://dl.dropboxusercontent.com/scl/fi/3q5weev57wtcmctw7wdo4/3b.5.png",
  "img/3b.6.png":"https://dl.dropboxusercontent.com/scl/fi/9pjc0570qf5fo5m9h8dzw/3b.6.png",
  "img/3b.7.png":"https://dl.dropboxusercontent.com/scl/fi/bhy7qjudubutflhapvo9h/3b.7.png",
  "img/3b.8.png":"https://dl.dropboxusercontent.com/scl/fi/rixwuko2zbko9gsozsplm/3b.8.png"

};

const QUESTIONS = [
  "3b.1","3b.2","3b.3","3b.4",
  "3b.5","3b.6","3b.7","3b.8"
];

const $ = (id)=>document.getElementById(id);

function shuffle(arr){
  return arr.slice().sort(()=>Math.random()-0.5);
}

async function startQuizFlow(e){

  e.preventDefault();

  const questionsDiv = $("questions");

  questionsDiv.innerHTML = "";

  const randomized = shuffle(QUESTIONS);

  randomized.forEach((qName, idx)=>{

    const qDiv = document.createElement("div");

    qDiv.className = "q";

    const choices = shuffle(QUESTIONS).slice(0,4);

    if(!choices.includes(qName)){
      choices[0] = qName;
    }

    qDiv.innerHTML = `
      <button class="playBtn" type="button">
        ▶ Play Example
      </button>

      <div class="choices"></div>
    `;

    const audio = new Audio(
      FILES[`audio/${qName}.mp3`]
    );

    qDiv.querySelector(".playBtn")
      .addEventListener("click", async ()=>{

        try{
          audio.pause();
          audio.currentTime = 0;
          await audio.play();
        }catch(err){
          console.error(err);
        }

      });

    const choicesDiv =
      qDiv.querySelector(".choices");

    shuffle(choices).forEach(choice=>{

      const label =
        document.createElement("label");

      label.className = "choice";

      label.innerHTML = `
        <input
          type="radio"
          name="Q${idx}"
          value="${choice}"
        />

        <img
          src="${FILES[`img/${choice}.png`]}"
        />
      `;

      label.addEventListener("click",()=>{

        label.querySelector("input").checked = true;

        choicesDiv
          .querySelectorAll(".choice")
          .forEach(c=>c.classList.remove("selected"));

        label.classList.add("selected");

      });

      choicesDiv.appendChild(label);

    });

    questionsDiv.appendChild(qDiv);

  });

  $("introCard").classList.add("hidden");
  $("quizCard").classList.remove("hidden");

}

document.addEventListener("DOMContentLoaded",()=>{

  $("introForm")
    .addEventListener(
      "submit",
      startQuizFlow
    );

});

</script>

</body>
</html>
