<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Patterns Set 3B Matching Quiz</title>

<style>

:root{
  --ncs-purple:#5B2C83;
  --ncs-purple-dark:#442061;
  --ncs-gold:#E5B223;
  --ncs-gold-light:#F2CC59;

  --bg:#faf8fc;
  --card:#ffffff;
  --border:#e7deef;
  --muted:#6e5d7d;

  --danger:#b00020;
  --ok:#0b6;

  --gap:14px;
  --radius:14px;
  --shadow:0 8px 20px rgba(91,44,131,.10);
}

*{
  box-sizing:border-box;
}

body{
  font-family: ui-sans-serif, system-ui, sans-serif;
  margin:0;
  padding:18px;

  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(229,178,35,.20), transparent 60%),
    radial-gradient(900px 500px at 90% -20%, rgba(91,44,131,.16), transparent 55%),
    var(--bg);

  color:#111827;
}

.shell{
  max-width:1200px;
  margin:0 auto;
}

.brandbar{
  display:flex;
  align-items:center;
  gap:12px;

  padding:14px 16px;
  border-radius:14px;

  background:linear-gradient(
    90deg,
    var(--ncs-purple),
    var(--ncs-purple-dark)
  );

  color:#fff;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.crest{
  width:44px;
  height:44px;
  border-radius:12px;

  background:linear-gradient(
    135deg,
    var(--ncs-gold),
    var(--ncs-gold-light)
  );

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:800;
  color:#4a2b00;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.hidden{
  display:none;
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
}

.field{
  flex:1;
  min-width:220px;

  display:flex;
  flex-direction:column;
  gap:6px;
}

label{
  font-size:12px;
  color:var(--muted);
}

input,
select{
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  font-size:14px;
}

button{
  padding:12px 16px;
  border:none;
  border-radius:12px;
  cursor:pointer;

  font-weight:700;
  font-size:14px;

  background:var(--ncs-purple);
  color:#fff;
}

button.secondary{
  background:#fff;
  color:var(--ncs-purple);
  border:1px solid var(--border);
}

.playBtn{
  background:linear-gradient(
    135deg,
    var(--ncs-gold),
    var(--ncs-gold-light)
  );

  color:#4a2b00;
}

.topActions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.pill{
  padding:6px 10px;
  border-radius:999px;

  background:rgba(229,178,35,.18);
  border:1px solid rgba(229,178,35,.35);

  font-size:12px;
  font-weight:700;
}

.divider{
  height:1px;
  background:var(--border);
  margin:18px 0;
}

.q{
  border-top:1px solid var(--border);
  padding-top:18px;
  margin-top:18px;
}

.choices{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:18px;
  margin-top:18px;
}

.choice{
  position:relative;

  border:1px solid var(--border);
  border-radius:18px;

  padding:12px;

  background:#fff;
  cursor:pointer;

  transition:.12s ease;
}

.choice:hover{
  transform:translateY(-2px);
}

.choice.selected{
  border-color:rgba(91,44,131,.5);
  box-shadow:0 0 0 4px rgba(91,44,131,.10);
}

.choice input{
  display:none;
}

.choice img{
  width:100%;
  max-width:420px;
  display:block;
  border-radius:12px;
}

.status{
  margin-top:12px;
  font-size:14px;
}

.status.ok{
  color:var(--ok);
}

.status.err{
  color:var(--danger);
}

/* REVIEW */

.reviewCorrect{
  border:3px solid #22c55e !important;
}

.reviewIncorrect{
  border:3px solid #ef4444 !important;
}

.correctBadge,
.incorrectBadge{
  position:absolute;
  top:12px;
  right:12px;

  width:36px;
  height:36px;
  border-radius:999px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
  font-weight:800;
  color:#fff;
}

.correctBadge{
  background:#22c55e;
}

.incorrectBadge{
  background:#ef4444;
}

</style>
</head>

<body>

<div class="shell">

<div class="brandbar">

  <div class="crest">NCS</div>

  <div>
    <div style="font-size:12px;opacity:.85;">
      National Cathedral School
    </div>

    <div style="font-weight:bold;">
      Patterns — Set 3B Matching Quiz
    </div>
  </div>

</div>

<!-- INTRO -->

<div id="introCard" class="card">

<h2>Welcome</h2>

<div style="color:#6e5d7d;font-size:14px;">
Listen to each example and choose the matching image.
</div>

<div style="height:14px;"></div>

<form id="introForm">

<div class="row">

<div class="field">
<label>First Name</label>
<input id="firstName" type="text" required />
</div>

<div class="field">
<label>Last Name</label>
<input id="lastName" type="text" required />
</div>

<div class="field">
<label>Email</label>
<input id="email" type="email" required />
</div>

<div class="field">
<label>Grade / Section</label>

<select id="gradeSection" required>
<option value="" selected disabled>Select…</option>
<option value="4WY">4WY</option>
<option value="4XZ">4XZ</option>
<option value="5A">5A</option>
<option value="5B">5B</option>
<option value="5C">5C</option>
</select>

</div>

</div>

<div class="divider"></div>

<div class="topActions">

<button id="startBtn" type="submit">
Start Quiz
</button>

<span class="pill">
8 Questions
</span>

</div>

<div id="introStatus" class="status"></div>

</form>

</div>

<!-- QUIZ -->

<div id="quizCard" class="card hidden">

<div class="topActions">

<h2 style="margin-right:auto;">Quiz</h2>

<button id="resetBtn" class="secondary" type="button">
Start Over
</button>

</div>

<div id="questions"></div>

<div class="divider"></div>

<div class="topActions">

<button id="submitBtn" type="button">
Submit
</button>

<span id="scorePreview"></span>

</div>

<div id="submitStatus" class="status"></div>

</div>

</div>

<script>

const GOOGLE_APPS_SCRIPT_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbyxZSjQrDuA9Uu3G3yx5X8Vl3lNcgFIDMmcMVos9pB66LKuiJTX6X3_rXRgkDpQfWc6/exec";
  
const QUIZ_CONFIG = {
  QUIZ_TITLE:"Patterns Set 3B Matching Quiz",
  REQUIRED_QUIZ_COUNT:8
};

const ASSET_INDEX = {

images:[
  {title:"3b.1.png",key:"img/3b.1.png"},
  {title:"3b.2.png",key:"img/3b.2.png"},
  {title:"3b.3.png",key:"img/3b.3.png"},
  {title:"3b.4.png",key:"img/3b.4.png"},
  {title:"3b.5.png",key:"img/3b.5.png"},
  {title:"3b.6.png",key:"img/3b.6.png"},
  {title:"3b.7.png",key:"img/3b.7.png"},
  {title:"3b.8.png",key:"img/3b.8.png"}
],

questions:[
  {id:"Q1",audioKey:"audio/3b.1.mp3",correctImageTitle:"3b.1.png"},
  {id:"Q2",audioKey:"audio/3b.2.mp3",correctImageTitle:"3b.2.png"},
  {id:"Q3",audioKey:"audio/3b.3.mp3",correctImageTitle:"3b.3.png"},
  {id:"Q4",audioKey:"audio/3b.4.mp3",correctImageTitle:"3b.4.png"},
  {id:"Q5",audioKey:"audio/3b.5.mp3",correctImageTitle:"3b.5.png"},
  {id:"Q6",audioKey:"audio/3b.6.mp3",correctImageTitle:"3b.6.png"},
  {id:"Q7",audioKey:"audio/3b.7.mp3",correctImageTitle:"3b.7.png"},
  {id:"Q8",audioKey:"audio/3b.8.mp3",correctImageTitle:"3b.8.png"}
]

};

const FILES = {

"audio/3b.1.mp3":"https://www.dropbox.com/scl/fi/swufkev1pa5pc0drogcl9/3b.1.mp3?raw=1",
"audio/3b.2.mp3":"https://www.dropbox.com/scl/fi/8sscdaw5smj1275088edq/3b.2.mp3?raw=1",
"audio/3b.3.mp3":"https://www.dropbox.com/scl/fi/jp844ubmmcj84wqo1b6bn/3b.3.mp3?raw=1",
"audio/3b.4.mp3":"https://www.dropbox.com/scl/fi/f411tt42aim4xcicgqb7i/3b.4.mp3?raw=1",
"audio/3b.5.mp3":"https://www.dropbox.com/scl/fi/3tq3vpc2mk12ihug9twia/3b.5.mp3?raw=1",
"audio/3b.6.mp3":"https://www.dropbox.com/scl/fi/kpacp1h4z9f4k7b9mi4v1/3b.6.mp3?raw=1",
"audio/3b.7.mp3":"https://www.dropbox.com/scl/fi/62mwusdszmp6uyorno2y5/3b.7.mp3?raw=1",
"audio/3b.8.mp3":"https://www.dropbox.com/scl/fi/6522pzyoesu926ebqc73v/3b.8.mp3?raw=1",

"img/3b.1.png":"https://www.dropbox.com/scl/fi/u3pbia8o838tb9qn5v73s/3b.1.png?raw=1",
"img/3b.2.png":"https://www.dropbox.com/scl/fi/rwbt63vrv5oi9qvp9n4zy/3b.2.png?raw=1",
"img/3b.3.png":"https://www.dropbox.com/scl/fi/oycyt4lj62jjq9tyhprr7/3b.3.png?raw=1",
"img/3b.4.png":"https://www.dropbox.com/scl/fi/gb0nd0zjwtx74w0h2wrop/3b.4.png?raw=1",
"img/3b.5.png":"https://www.dropbox.com/scl/fi/3q5weev57wtcmctw7wdo4/3b.5.png?raw=1",
"img/3b.6.png":"https://www.dropbox.com/scl/fi/9pjc0570qf5fo5m9h8dzw/3b.6.png?raw=1",
"img/3b.7.png":"https://www.dropbox.com/scl/fi/bhy7qjudubutflhapvo9h/3b.7.png?raw=1",
"img/3b.8.png":"https://www.dropbox.com/scl/fi/rixwuko2zbko9gsozsplm/3b.8.png?raw=1"

};

const $ = (id)=>document.getElementById(id);

let quizQuestions = [];

function shuffle(arr){
  return arr.slice().sort(()=>Math.random()-0.5);
}

function normalizeInputsFromServer(){

  quizQuestions =
    shuffle(ASSET_INDEX.questions)
      .slice(0, QUIZ_CONFIG.REQUIRED_QUIZ_COUNT);

}

async function buildQuizQuestions(){

  const container = $("questions");

  container.innerHTML = "";

  for(let idx=0; idx<quizQuestions.length; idx++){

    const q = quizQuestions[idx];

    const qDiv = document.createElement("div");

    qDiv.className = "q";

    qDiv.innerHTML = `
      <div class="audioRow">
        <button class="playBtn" type="button">
          ▶ Play Example
        </button>
      </div>
    `;

    const audio = document.createElement("audio");

    audio.src = FILES[q.audioKey];

    const playBtn = qDiv.querySelector(".playBtn");

    playBtn.addEventListener("click", async ()=>{

      try{
        audio.pause();
        audio.currentTime = 0;
        await audio.play();
      }catch(err){
        console.error(err);
      }

    });

    qDiv.appendChild(audio);

    const correct =
      ASSET_INDEX.images.find(
        i => i.title === q.correctImageTitle
      );

    const distractors =
      shuffle(
        ASSET_INDEX.images.filter(i => i !== correct)
      ).slice(0,3);

    const choices =
      shuffle([correct, ...distractors]);

    const wrap = document.createElement("div");

    wrap.className = "choices";

    for(const imgObj of choices){

      const label = document.createElement("label");

      label.className = "choice";

      label.innerHTML = `
        <input
          type="radio"
          name="${q.id}"
          value="${imgObj.title}"
          required
        />

        <img src="${FILES[imgObj.key]}" />
      `;

      wrap.appendChild(label);

      label.addEventListener("click",()=>{

        label.querySelector("input").checked = true;

        wrap.querySelectorAll(".choice")
          .forEach(c=>c.classList.remove("selected"));

        label.classList.add("selected");

      });

    }

    qDiv.appendChild(wrap);

    container.appendChild(qDiv);

  }

}

async function startQuizFlow(e){

  e.preventDefault();

  normalizeInputsFromServer();

  await buildQuizQuestions();

  $("introCard").classList.add("hidden");

  $("quizCard").classList.remove("hidden");

}

async function submitQuiz(){

  let score = 0;

  const answers = [];

  for(const q of quizQuestions){

    const selected =
      document.querySelector(
        `input[name="${q.id}"]:checked`
      );

    if(!selected){
      alert("Please answer every question.");
      return;
    }

    const selectedTitle = selected.value;

    const isCorrect =
      selectedTitle === q.correctImageTitle;

    if(isCorrect) score++;

    answers.push({
      questionId:q.id,
      selectedImageTitle:selectedTitle,
      correctImageTitle:q.correctImageTitle,
      isCorrect
    });

  }

  $("scorePreview").textContent =
    `Score: ${score} / ${quizQuestions.length}`;

  const payload = {

    quizTitle:QUIZ_CONFIG.QUIZ_TITLE,

    submittedAtISO:new Date().toISOString(),

    student:{
      firstName:$("firstName").value.trim(),
      lastName:$("lastName").value.trim(),
      email:$("email").value.trim(),
      gradeSection:$("gradeSection").value
    },

    result:{
      score,
      total:quizQuestions.length,
      answers
    },

    userAgent:navigator.userAgent

  };

  try{

    await fetch(
      GOOGLE_APPS_SCRIPT_WEB_APP_URL,
      {
        method:"POST",
        body:JSON.stringify(payload)
      }
    );

    console.log("Fetch completed.");

    showReview(answers);

    $("submitStatus").textContent =
      "Results submitted successfully.";

    $("submitStatus").className =
      "status ok";

  }catch(err){

    console.error("FULL ERROR:", err);

    $("submitStatus").textContent =
      "Submission failed: " + err;

    $("submitStatus").className =
      "status err";

  }

}

function showReview(answers){

  for(const answer of answers){

    const qDiv =
      document.querySelectorAll(".q")[
        answers.indexOf(answer)
      ];

    if(!qDiv) continue;

    const choices =
      qDiv.querySelectorAll(".choice");

    choices.forEach(choice=>{

      const input =
        choice.querySelector("input");

      if(!input) return;

      if(input.value === answer.selectedImageTitle){

        if(answer.isCorrect){

          choice.classList.add("reviewCorrect");

          const badge =
            document.createElement("div");

          badge.className = "correctBadge";

          badge.textContent = "✓";

          choice.appendChild(badge);

        }else{

          choice.classList.add("reviewIncorrect");

          const badge =
            document.createElement("div");

          badge.className = "incorrectBadge";

          badge.textContent = "✕";

          choice.appendChild(badge);

        }

      }

      if(
        input.value === answer.correctImageTitle &&
        !answer.isCorrect
      ){

        choice.classList.add("reviewCorrect");

      }

    });

  }

  $("submitBtn").disabled = true;

}

document.addEventListener("DOMContentLoaded",()=>{

  $("introForm")
    .addEventListener(
      "submit",
      startQuizFlow
    );

  $("submitBtn")
    .addEventListener(
      "click",
      submitQuiz
    );

});

</script>

</body>
</html>
