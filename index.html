<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Patterns Set 3B Matching Quiz</title>

  <style>

    :root{
      --ncs-navy:#0b1f3b;
      --ncs-gold:#caa43b;
      --bg:#f6f7fb;
      --card:#fff;
      --border:#e6e8ef;
      --muted:#5b6472;
      --danger:#b00020;
      --ok:#0b6;
      --radius:14px;
      --shadow:0 8px 20px rgba(9,20,40,.08);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:18px;
      background:var(--bg);
      font-family:Arial,sans-serif;
      color:#111827;
    }

    .shell{
      max-width:1600px;
      margin:0 auto;
    }

    .brandbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 16px;
      border-radius:14px;
      background:linear-gradient(90deg,var(--ncs-navy),#112b52);
      color:#fff;
      margin-bottom:16px;
      box-shadow:var(--shadow);
    }

    .crest{
      width:44px;
      height:44px;
      border-radius:10px;
      background:var(--ncs-gold);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#111;
      font-weight:bold;
    }

    .card{
      background:#fff;
      border-radius:14px;
      padding:20px;
      box-shadow:var(--shadow);
      margin-bottom:18px;
    }

    .hidden{
      display:none;
    }

    h2{
      margin-top:0;
    }

    .muted{
      color:var(--muted);
      font-size:14px;
    }

    .row{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
    }

    .field{
      display:flex;
      flex-direction:column;
      flex:1;
      min-width:220px;
      gap:6px;
    }

    input,select{
      padding:12px;
      border-radius:12px;
      border:1px solid var(--border);
      font-size:14px;
    }

    button{
      padding:12px 16px;
      border:none;
      border-radius:12px;
      background:var(--ncs-navy);
      color:#fff;
      cursor:pointer;
      font-weight:bold;
      font-size:14px;
    }

    button.secondary{
      background:#fff;
      color:var(--ncs-navy);
      border:1px solid var(--border);
    }

    .playBtn{
      background:var(--ncs-gold);
      color:#111;
    }

    .status{
      margin-top:10px;
      font-size:13px;
    }

    .status.err{
      color:var(--danger);
    }

    .status.ok{
      color:var(--ok);
    }

    .divider{
      height:1px;
      background:var(--border);
      margin:16px 0;
    }

    .q{
      margin-top:24px;
      padding-top:24px;
      border-top:1px solid var(--border);
    }

    .qHeader{
      margin-bottom:12px;
    }

    .audioRow{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    .choices{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(520px,1fr));
      gap:20px;
    }

    .choice{
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      background:#fff;
      transition:.12s ease;
    }

    .choice:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 16px rgba(9,20,40,.08);
    }

    .choice.selected{
      border-color:var(--ncs-navy);
      box-shadow:0 0 0 4px rgba(11,31,59,.08);
    }

    .choice img{
      width:450px;
      height:auto;
      border-radius:12px;
      display:block;
    }

    .topActions{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }

    .pill{
      background:rgba(202,164,59,.18);
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
    }

  </style>
</head>

<body>

<div class="shell">

  <div class="brandbar">

    <div class="crest">NCS</div>

    <div>
      <div style="font-size:12px;opacity:.85;">
        National Cathedral School
      </div>

      <div style="font-weight:bold;">
        Patterns — Set 3B Matching Quiz
      </div>
    </div>

  </div>

  <!-- INTRO -->

  <div id="introCard" class="card">

    <h2>Welcome</h2>

    <div class="muted">
      Listen to each example and choose the matching image.
      You may replay examples as needed.
    </div>

    <div style="height:12px;"></div>

    <form id="introForm">

      <div class="row">

        <div class="field">
          <label>First Name</label>
          <input id="firstName" type="text" required />
        </div>

        <div class="field">
          <label>Last Name</label>
          <input id="lastName" type="text" required />
        </div>

        <div class="field">
          <label>Email</label>
          <input id="email" type="email" required />
        </div>

        <div class="field">

          <label>Grade / Section</label>

          <select id="gradeSection" required>
            <option value="" selected disabled>Select…</option>
            <option value="4WY">4WY</option>
            <option value="4XZ">4XZ</option>
            <option value="5A">5A</option>
            <option value="5B">5B</option>
            <option value="5C">5C</option>
          </select>

        </div>

      </div>

      <div class="divider"></div>

      <div class="topActions">
        <button id="startBtn" type="submit">
          Start Quiz
        </button>

        <span class="pill">
          4 Questions
        </span>
      </div>

      <div id="introStatus" class="status"></div>

    </form>

  </div>

  <!-- QUIZ -->

  <div id="quizCard" class="card hidden">

    <div class="topActions">

      <h2 style="margin-right:auto;">
        Quiz
      </h2>

      <button id="resetBtn" class="secondary" type="button">
        Start Over
      </button>

    </div>

    <div id="questions"></div>

    <div class="divider"></div>

    <div class="topActions">

      <button id="submitBtn" type="button">
        Submit
      </button>

      <span id="scorePreview"></span>

    </div>

    <div id="submitStatus" class="status"></div>

  </div>

  <!-- DONE -->

  <div id="doneCard" class="card hidden">

    <h2>Finished!</h2>

    <div id="doneMsg"></div>

    <div style="height:12px;"></div>

    <button id="doneResetBtn" class="secondary">
      Start Over
    </button>

  </div>

</div>

<script>

const GOOGLE_APPS_SCRIPT_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbyxZSjQrDuA9Uu3G3yx5X8Vl3lNcgFIDMmcMVos9pB66LKuiJTX6X3_rXRgkDpQfWc6/exec"
  
  const QUIZ_CONFIG = {
  QUIZ_TITLE:"Patterns Set 3B Matching Quiz",
  REQUIRED_QUIZ_COUNT:4
};

const ASSET_INDEX = {

  images:[
    {title:"3b.1.png",key:"img/3b.1.png"},
    {title:"3b.2.png",key:"img/3b.2.png"},
    {title:"3b.3.png",key:"img/3b.3.png"},
    {title:"3b.4.png",key:"img/3b.4.png"},
    {title:"3b.5.png",key:"img/3b.5.png"},
    {title:"3b.6.png",key:"img/3b.6.png"},
    {title:"3b.7.png",key:"img/3b.7.png"},
    {title:"3b.8.png",key:"img/3b.8.png"}
  ],

  questions:[
    {id:"Q1",prompt:"Question 1",audioKey:"audio/3b.1.mp3",correctImageTitle:"3b.1.png"},
    {id:"Q2",prompt:"Question 2",audioKey:"audio/3b.2.mp3",correctImageTitle:"3b.2.png"},
    {id:"Q3",prompt:"Question 3",audioKey:"audio/3b.3.mp3",correctImageTitle:"3b.3.png"},
    {id:"Q4",prompt:"Question 4",audioKey:"audio/3b.4.mp3",correctImageTitle:"3b.4.png"},
    {id:"Q5",prompt:"Question 5",audioKey:"audio/3b.5.mp3",correctImageTitle:"3b.5.png"},
    {id:"Q6",prompt:"Question 6",audioKey:"audio/3b.6.mp3",correctImageTitle:"3b.6.png"},
    {id:"Q7",prompt:"Question 7",audioKey:"audio/3b.7.mp3",correctImageTitle:"3b.7.png"},
    {id:"Q8",prompt:"Question 8",audioKey:"audio/3b.8.mp3",correctImageTitle:"3b.8.png"}
  ]

};

const FILES = {

  // AUDIO

  "audio/3b.1.mp3":"https://www.dropbox.com/scl/fi/swufkev1pa5pc0drogcl9/3b.1.mp3?rlkey=y5tmhk8xppfvvskgdofedyd1u&raw=1",
  "audio/3b.2.mp3":"https://www.dropbox.com/scl/fi/8sscdaw5smj1275088edq/3b.2.mp3?rlkey=1fq2jmrrfryar2z2nmue01jan&raw=1",
  "audio/3b.3.mp3":"https://www.dropbox.com/scl/fi/jp844ubmmcj84wqo1b6bn/3b.3.mp3?rlkey=ha3lhcnco5piwexun6zo953ye&raw=1",
  "audio/3b.4.mp3":"https://www.dropbox.com/scl/fi/f411tt42aim4xcicgqb7i/3b.4.mp3?rlkey=lxyc0q3knjy4klq5khhen3t7c&raw=1",
  "audio/3b.5.mp3":"https://www.dropbox.com/scl/fi/3tq3vpc2mk12ihug9twia/3b.5.mp3?rlkey=gv1mugqn3lt19b4st8ufjwp99&raw=1",
  "audio/3b.6.mp3":"https://www.dropbox.com/scl/fi/kpacp1h4z9f4k7b9mi4v1/3b.6.mp3?rlkey=775xmw5j74sst3yco6hz9h4z1&raw=1",
  "audio/3b.7.mp3":"https://www.dropbox.com/scl/fi/62mwusdszmp6uyorno2y5/3b.7.mp3?rlkey=mhp1ycohrpgjvykhbg0juaqqe&raw=1",
  "audio/3b.8.mp3":"https://www.dropbox.com/scl/fi/6522pzyoesu926ebqc73v/3b.8.mp3?rlkey=j4z8yuqvcti1cx0ntiz6qoner&raw=1",

  // IMAGES

  "img/3b.1.png":"https://www.dropbox.com/scl/fi/u3pbia8o838tb9qn5v73s/3b.1.png?rlkey=1khe8r17y2es65mz69ecxzz4l&raw=1",
  "img/3b.2.png":"https://www.dropbox.com/scl/fi/rwbt63vrv5oi9qvp9n4zy/3b.2.png?rlkey=34kya7zwx1meh2y1k11op7nxx&raw=1",
  "img/3b.3.png":"https://www.dropbox.com/scl/fi/oycyt4lj62jjq9tyhprr7/3b.3.png?rlkey=tf6fbjlxhvsg4qfqrzbix5cz4&raw=1",
  "img/3b.4.png":"https://www.dropbox.com/scl/fi/gb0nd0zjwtx74w0h2wrop/3b.4.png?rlkey=tszanhkt93r3qe6j8epk01xwv&raw=1",
  "img/3b.5.png":"https://www.dropbox.com/scl/fi/3q5weev57wtcmctw7wdo4/3b.5.png?rlkey=shtob48rh5ci6bzlung2warfq&raw=1",
  "img/3b.6.png":"https://www.dropbox.com/scl/fi/9pjc0570qf5fo5m9h8dzw/3b.6.png?rlkey=vqi7otnpaje2q80vlv9cp9bav&raw=1",
  "img/3b.7.png":"https://www.dropbox.com/scl/fi/bhy7qjudubutflhapvo9h/3b.7.png?rlkey=4li2a0l2wgg7hjkq5bx9idizh&raw=1",
  "img/3b.8.png":"https://www.dropbox.com/scl/fi/rixwuko2zbko9gsozsplm/3b.8.png?rlkey=sx1w26k3isuxtjg879z9jyvsf&raw=1"

};

const $ = (id)=>document.getElementById(id);

let quizQuestions = [];

function shuffle(arr){
  return arr.slice().sort(()=>Math.random()-0.5);
}

function normalizeInputsFromServer(){

  quizQuestions =
    shuffle(ASSET_INDEX.questions)
    .slice(0, QUIZ_CONFIG.REQUIRED_QUIZ_COUNT);

}

function getStudent(){

  return{
    firstName:$("firstName").value.trim(),
    lastName:$("lastName").value.trim(),
    email:$("email").value.trim(),
    gradeSection:$("gradeSection").value
  };

}

function computeResult(){

  const answers = [];
  let score = 0;

  for(const q of quizQuestions){

    const selected =
      document.querySelector(`input[name="${q.id}"]:checked`);

    const selectedTitle =
      selected ? selected.value : "";

    const isCorrect =
      selectedTitle === q.correctImageTitle;

    if(isCorrect) score++;

    answers.push({
      questionId:q.id,
      selectedImageTitle:selectedTitle,
      correctImageTitle:q.correctImageTitle,
      isCorrect
    });

  }

  return{
    score,
    total:quizQuestions.length,
    answers
  };

}

async function buildQuizQuestions(){

  const container = $("questions");

  container.innerHTML = "";

  for(let idx = 0; idx < quizQuestions.length; idx++){

    const q = quizQuestions[idx];

    const qDiv = document.createElement("div");

    qDiv.className = "q";

    qDiv.innerHTML = `

      <div class="qHeader">
        <p><strong>${idx + 1}. ${q.prompt}</strong></p>
      </div>

      <div class="audioRow">

        <button class="playBtn" type="button">
          ▶ Play Example
        </button>

        <span class="muted">
          You may replay this example as many times as needed.
        </span>

      </div>

    `;

    const audio = document.createElement("audio");

    audio.src = FILES[q.audioKey];
    audio.preload = "auto";

    const playBtn = qDiv.querySelector(".playBtn");

    playBtn.addEventListener("click", async () => {

      try {

        audio.pause();

        audio.currentTime = 0;

        await audio.play();

      } catch(err) {

        console.error("Audio playback error:", err);

      }

    });

    qDiv.appendChild(audio);

    const correct =
      ASSET_INDEX.images.find(
        i => i.title === q.correctImageTitle
      );

    const distractors =
      shuffle(
        ASSET_INDEX.images.filter(i => i !== correct)
      ).slice(0,3);

    const choices =
      shuffle([correct, ...distractors]);

    const wrap =
      document.createElement("div");

    wrap.className = "choices";

    for(const imgObj of choices){

      const label =
        document.createElement("label");

      label.className = "choice";

      label.innerHTML = `

        <input
          type="radio"
          name="${q.id}"
          value="${imgObj.title}"
          required
        />

        <img src="${FILES[imgObj.key]}" />

      `;

      wrap.appendChild(label);

    }

    qDiv.appendChild(wrap);

    container.appendChild(qDiv);

  }

}

async function submitResults(){

  $("submitBtn").disabled = true;

  const payload = {

    quizTitle: QUIZ_CONFIG.QUIZ_TITLE,

    submittedAtISO: new Date().toISOString(),

    student: getStudent(),

    result: computeResult(),

    userAgent: navigator.userAgent

  };

  $("scorePreview").textContent =
    `Score: ${payload.result.score} / ${payload.result.total}`;

  try{

    await fetch(
      GOOGLE_APPS_SCRIPT_WEB_APP_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type": "text/plain"
        },

        body: JSON.stringify(payload)
      }
    );

    // no-cors prevents reading response JSON
    // so assume success if no fetch error thrown

    $("quizCard").classList.add("hidden");

    $("doneCard").classList.remove("hidden");

    $("doneMsg").textContent =
      `Score: ${payload.result.score} / ${payload.result.total}`;

  }catch(err){

    console.error(err);

    $("submitStatus").textContent =
      "Unable to submit results.";

    $("submitStatus").className =
      "status err";
  }

  $("submitBtn").disabled = false;
}
async function startQuizFlow(e){

  e.preventDefault();

  normalizeInputsFromServer();

  await buildQuizQuestions();

  $("introCard").classList.add("hidden");

  $("quizCard").classList.remove("hidden");

}

function resetUIOnly(){

  $("questions").innerHTML = "";

  $("introCard").classList.remove("hidden");

  $("quizCard").classList.add("hidden");

  $("doneCard").classList.add("hidden");

}

document.addEventListener("DOMContentLoaded",()=>{

  $("introForm")
    .addEventListener("submit",startQuizFlow);

  $("submitBtn")
    .addEventListener("click",submitResults);

  $("resetBtn")
    .addEventListener("click",resetUIOnly);

  $("doneResetBtn")
    .addEventListener("click",resetUIOnly);

});

</script>

</body>
</html>
```
