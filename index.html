<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patterns Set 3B Matching Quiz</title>
  <style>
    :root{
      --ncs-navy:#0b1f3b; --ncs-gold:#caa43b; --bg:#f6f7fb; --card:#fff;
      --border:#e6e8ef; --muted:#5b6472; --danger:#b00020; --ok:#0b6;
      --radius:14px; --shadow:0 8px 20px rgba(9,20,40,.08);
    }
    *{box-sizing:border-box}
    body{
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      padding:18px; margin:0;
      background:radial-gradient(1200px 600px at 10% -10%,rgba(202,164,59,.22),transparent 60%),
                 radial-gradient(900px 500px at 90% -20%,rgba(11,31,59,.18),transparent 55%),
                 var(--bg);
      color:#111827;
    }
    .shell{max-width:980px;margin:0 auto}
    .brandbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--border);background:linear-gradient(90deg,var(--ncs-navy),#112b52);color:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px}
    .crest{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,rgba(202,164,59,.95),rgba(202,164,59,.55));display:flex;align-items:center;justify-content:center;color:#1b1b1b;font-weight:800;letter-spacing:.5px;flex:0 0 auto}
    .brandtext{line-height:1.1}.brandtext .org{font-size:12px;opacity:.9;letter-spacing:.4px;text-transform:uppercase}.brandtext .title{font-size:16px;font-weight:750;margin-top:3px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:0 auto 14px;box-shadow:var(--shadow)}
    h2{margin:0 0 8px;font-size:20px}.muted{color:var(--muted);font-size:13px}.hidden{display:none}
    .row{display:flex;flex-wrap:wrap;gap:14px}.field{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1}
    label{font-size:12px;color:var(--muted)}
    input[type="text"],input[type="email"],select{padding:12px;border:1px solid var(--border);border-radius:12px;font-size:14px;background:#fff;outline:none}
    input:focus,select:focus{border-color:rgba(11,31,59,.35);box-shadow:0 0 0 4px rgba(11,31,59,.10)}
    button{padding:12px 16px;border:1px solid transparent;border-radius:12px;background:var(--ncs-navy);color:#fff;cursor:pointer;font-size:14px;font-weight:650}
    button.secondary{background:#fff;color:var(--ncs-navy);border:1px solid var(--border)}button:disabled{opacity:.55;cursor:not-allowed}
    .status{margin-top:10px;font-size:13px;white-space:pre-line}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}
    .topActions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(202,164,59,.18);border:1px solid rgba(202,164,59,.35);font-size:12px;color:#3b2f05;font-weight:650}
    .divider{height:1px;background:var(--border);margin:12px 0}.spacer{height:6px}
    .q{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
    .qHeader{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}.qTitle{font-weight:750;margin:0}
    .onceTag{font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid rgba(11,31,59,.18);background:rgba(11,31,59,.06);color:var(--ncs-navy);white-space:nowrap}
    .audioRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.playBtn{background:var(--ncs-gold);color:#1b1b1b;border:1px solid rgba(0,0,0,.08)}.playBtn:disabled{opacity:.5}
    .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}
    .choice{border:1px solid var(--border);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;align-items:center;cursor:pointer;background:#fff;transition:transform .08s ease,box-shadow .08s ease,border-color .08s ease;min-height:210px;user-select:none}
    .choice:hover{transform:translateY(-1px);box-shadow:0 10px 16px rgba(9,20,40,.08)}.choice input{transform:scale(1.2)}.choice img{width:150px;height:auto;border-radius:10px;display:block}.choice.selected{border-color:rgba(11,31,59,.35);box-shadow:0 0 0 4px rgba(11,31,59,.08)}
    .progressWrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.progressBar{width:min(460px,100%);height:10px;background:#eef0f6;border-radius:999px;overflow:hidden;border:1px solid var(--border)}.progressFill{height:100%;width:0%;background:linear-gradient(90deg,var(--ncs-gold),#ffd97b);transition:width .18s ease}
  </style>
</head>
<body>
  <div class="shell">
    <div class="brandbar"><div class="crest">NCS</div><div class="brandtext"><div class="org">National Cathedral School</div><div class="title">Patterns — Set 3B Matching Quiz</div></div></div>
    <div id="introCard" class="card">
      <h2>Welcome</h2><div class="muted">Listen to each example and choose the matching image. Audio plays <b>once</b>.</div><div class="spacer"></div>
      <form id="introForm">
        <div class="row">
          <div class="field"><label for="firstName">First Name</label><input id="firstName" type="text" required /></div>
          <div class="field"><label for="lastName">Last Name</label><input id="lastName" type="text" required /></div>
          <div class="field"><label for="email">Email</label><input id="email" type="email" required /></div>
          <div class="field"><label for="gradeSection">Grade / Section</label><select id="gradeSection" required><option value="" selected disabled>Select…</option><option value="4WY">4WY</option><option value="4XZ">4XZ</option><option value="5A">5A</option><option value="5B">5B</option><option value="5C">5C</option></select></div>
        </div>
        <div class="divider"></div><div class="topActions"><button id="startBtn" type="submit">Start Quiz</button><span id="countPill" class="pill">4 questions</span></div><div id="introStatus" class="status"></div>
      </form>
    </div>
    <div id="quizCard" class="card hidden">
      <div class="topActions"><h2 style="margin-right:auto;">Quiz</h2><button id="resetBtn" type="button" class="secondary">Start Over</button></div>
      <div id="quizStatus" class="status"></div>
      <div id="preloadUI" class="hidden"><div class="progressWrap"><span class="pill">Loading media…</span><div class="progressBar"><div id="progressFill" class="progressFill"></div></div><span id="progressText" class="muted"></span></div><div class="spacer"></div></div>
      <div id="questions"></div><div class="divider"></div><div class="topActions"><button id="submitBtn" type="button">Submit</button><span id="scorePreview" class="muted"></span></div><div id="submitStatus" class="status"></div>
    </div>
    <div id="doneCard" class="card hidden"><h2>Finished!</h2><div id="doneMsg" class="muted"></div><div class="spacer"></div><button id="doneResetBtn" type="button" class="secondary">Start Over</button></div>
  </div>
<script>
const GOOGLE_APPS_SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwzz8xLaS-u2vf-jhUHKrCGuCVkIxgSGiyKCF-hNJULrfV9C5-wbXv1EjmMRJvRsCsm/exec";

const QUIZ_CONFIG = { QUIZ_TITLE:"Patterns Set 3B Matching Quiz", REQUIRED_QUIZ_COUNT:4, RANDOMIZE_QUESTIONS:true, PLAY_ONCE_ONLY:true, PRELOAD_AUDIO:true };

function dropboxRaw(url){ const u = new URL(url); u.searchParams.delete("dl"); u.searchParams.set("raw","1"); return u.toString(); }

const ASSET_INDEX = {
  images:[
    {title:"3b.1.png",url:dropboxRaw("https://www.dropbox.com/scl/fi/u3pbia8o838tb9qn5v73s/3b.1.png?rlkey=1khe8r17y2es65mz69ecxzz4l&st=7jlz8h1b&dl=0")},
    {title:"3b.2.png",url:dropboxRaw("https://www.dropbox.com/scl/fi/rwbt63vrv5oi9qvp9n4zy/3b.2.png?rlkey=34kya7zwx1meh2y1k11op7nxx&st=jr1ks99g&dl=0")},
    {title:"3b.3.png",url:dropboxRaw("https://www.dropbox.com/scl/fi/oycyt4lj62jjq9tyhprr7/3b.3.png?rlkey=tf6fbjlxhvsg4qfqrzbix5cz4&st=mowq0ijm&dl=0")},
    {title:"3b.4.png",url:dropboxRaw("https://www.dropbox.com/scl/fi/gb0nd0zjwtx74w0h2wrop/3b.4.png?rlkey=tszanhkt93r3qe6j8epk01xwv&st=sp87h68k&dl=0")},
    {title:"3b.5.png",url:dropboxRaw("https://www.dropbox.com/scl/fi/3q5weev57wtcmctw7wdo4/3b.5.png?rlkey=shtob48rh5ci6bzlung2warfq&st=hc2fnu3g&dl=0")},
    {title:"3b.6.png",url:dropboxRaw("https://www.dropbox.com/scl/fi/9pjc0570qf5fo5m9h8dzw/3b.6.png?rlkey=vqi7otnpaje2q80vlv9cp9bav&st=x9k8mwrr&dl=0")},
    {title:"3b.7.png",url:dropboxRaw("https://www.dropbox.com/scl/fi/bhy7qjudubutflhapvo9h/3b.7.png?rlkey=4li2a0l2wgg7hjkq5bx9idizh&st=bk3zr4tk&dl=0")},
    {title:"3b.8.png",url:dropboxRaw("https://www.dropbox.com/scl/fi/rixwuko2zbko9gsozsplm/3b.8.png?rlkey=sx1w26k3isuxtjg879z9jyvsf&st=mn4zjo87&dl=0")}
  ],
  questions:[
    {id:"Q1",prompt:"Question 1",audioUrl:dropboxRaw("https://www.dropbox.com/scl/fi/swufkev1pa5pc0drogcl9/3b.1.mp3?rlkey=y5tmhk8xppfvvskgdofedyd1u&st=aznp0up3&dl=0"),correctImageTitle:"3b.1.png"},
    {id:"Q2",prompt:"Question 2",audioUrl:dropboxRaw("https://www.dropbox.com/scl/fi/8sscdaw5smj1275088edq/3b.2.mp3?rlkey=1fq2jmrrfryar2z2nmue01jan&st=agfdrcit&dl=0"),correctImageTitle:"3b.2.png"},
    {id:"Q3",prompt:"Question 3",audioUrl:dropboxRaw("https://www.dropbox.com/scl/fi/jp844ubmmcj84wqo1b6bn/3b.3.mp3?rlkey=ha3lhcnco5piwexun6zo953ye&st=3v31n08e&dl=0"),correctImageTitle:"3b.3.png"},
    {id:"Q4",prompt:"Question 4",audioUrl:dropboxRaw("https://www.dropbox.com/scl/fi/f411tt42aim4xcicgqb7i/3b.4.mp3?rlkey=lxyc0q3knjy4klq5khhen3t7c&st=riavb0kf&dl=0"),correctImageTitle:"3b.4.png"},
    {id:"Q5",prompt:"Question 5",audioUrl:dropboxRaw("https://www.dropbox.com/scl/fi/3tq3vpc2mk12ihug9twia/3b.5.mp3?rlkey=gv1mugqn3lt19b4st8ufjwp99&st=u0wjuiq5&dl=0"),correctImageTitle:"3b.5.png"},
    {id:"Q6",prompt:"Question 6",audioUrl:dropboxRaw("https://www.dropbox.com/scl/fi/kpacp1h4z9f4k7b9mi4v1/3b.6.mp3?rlkey=775xmw5j74sst3yco6hz9h4z1&st=5omdq0qo&dl=0"),correctImageTitle:"3b.6.png"},
    {id:"Q7",prompt:"Question 7",audioUrl:dropboxRaw("https://www.dropbox.com/scl/fi/62mwusdszmp6uyorno2y5/3b.7.mp3?rlkey=mhp1ycohrpgjvykhbg0juaqqe&st=d7ab6rjt&dl=0"),correctImageTitle:"3b.7.png"},
    {id:"Q8",prompt:"Question 8",audioUrl:dropboxRaw("https://www.dropbox.com/scl/fi/6522pzyoesu926ebqc73v/3b.8.mp3?rlkey=j4z8yuqvcti1cx0ntiz6qoner&st=nbr7yggo&dl=0"),correctImageTitle:"3b.8.png"}
  ]
};

const $ = id => document.getElementById(id);
let BUILDING=false, audioElByQ=new Map(), playedOnce=new Set(), quizQuestions=[], imagesIndex=[];

function setStatus(el,msg,type){ if(!el)return; el.textContent=msg||""; el.className="status"+(type?" "+type:""); }
function shuffle(arr){ return arr.slice().sort(()=>Math.random()-.5); }

function initializeQuizData(){
  const requiredCount=Number(QUIZ_CONFIG.REQUIRED_QUIZ_COUNT||4);
  imagesIndex=ASSET_INDEX.images||[];
  const allQuestions=ASSET_INDEX.questions||[];
  const qPool=QUIZ_CONFIG.RANDOMIZE_QUESTIONS?shuffle(allQuestions):allQuestions.slice();
  quizQuestions=qPool.slice(0,requiredCount);
  $("countPill").textContent=`${quizQuestions.length} question${quizQuestions.length===1?"":"s"}`;
}

async function preloadAllMedia(questions,images){
  if(!QUIZ_CONFIG.PRELOAD_AUDIO) return;
  $("preloadUI").classList.remove("hidden");
  const fill=$("progressFill"), txt=$("progressText");
  const urls=[...questions.map(q=>q.audioUrl),...images.map(i=>i.url)];
  let done=0, total=urls.length||1;
  const tick=()=>{ done++; fill.style.width=Math.round(done/total*100)+"%"; txt.textContent=`${done} / ${total}`; };
  await Promise.all(urls.map(url=>new Promise(resolve=>{
    if(/\.mp3(\?|$)/i.test(url)){
      const audio=new Audio(); audio.preload="auto"; audio.oncanplaythrough=()=>{tick();resolve();}; audio.onerror=()=>{tick();resolve();}; audio.src=url; audio.load();
    } else {
      const img=new Image(); img.onload=()=>{tick();resolve();}; img.onerror=()=>{tick();resolve();}; img.src=url;
    }
  })));
  $("preloadUI").classList.add("hidden");
}

function wireChoiceHighlighting(container){
  container.addEventListener("change",e=>{
    const input=e.target; if(!input||input.type!=="radio")return;
    container.querySelectorAll(`input[name="${input.name}"]`).forEach(r=>{
      const card=r.closest(".choice"); if(card) card.classList.toggle("selected",r.checked);
    });
  });
}

async function buildQuizQuestions(){
  initializeQuizData();
  if(!quizQuestions.length||!imagesIndex.length) throw new Error("Quiz data did not load. Check ASSET_INDEX.");
  const container=$("questions"); container.innerHTML=""; setStatus($("quizStatus"),"Loading quiz…","");
  try{ await preloadAllMedia(quizQuestions,imagesIndex); }catch(e){ console.error("Preload failed:",e); }
  playedOnce.clear(); audioElByQ.clear();

  for(let idx=0; idx<quizQuestions.length; idx++){
    const q=quizQuestions[idx], qDiv=document.createElement("div");
    qDiv.className="q"; qDiv.dataset.qid=q.id;
    qDiv.innerHTML=`<div class="qHeader"><p class="qTitle">${idx+1}. ${q.prompt}</p>${QUIZ_CONFIG.PLAY_ONCE_ONLY?`<span class="onceTag">Audio plays once</span>`:""}</div><div class="audioRow"><button class="playBtn" type="button" data-play="${q.id}">▶ Play</button><span class="muted" data-playhint="${q.id}">Press play, then choose an image.</span></div>`;
    const audio=document.createElement("audio"); audio.preload=QUIZ_CONFIG.PRELOAD_AUDIO?"auto":"metadata"; audio.src=q.audioUrl; audioElByQ.set(q.id,audio); qDiv.appendChild(audio);

    const correct=imagesIndex.find(i=>i.title===q.correctImageTitle);
    const choices=shuffle([correct,...shuffle(imagesIndex.filter(i=>i.title!==q.correctImageTitle)).slice(0,3)].filter(Boolean));
    const wrap=document.createElement("div"); wrap.className="choices";
    for(const imgObj of choices){
      const label=document.createElement("label"); label.className="choice";
      label.innerHTML=`<input type="radio" name="${q.id}" value="${imgObj.title}" required /><img src="${imgObj.url}" alt="${imgObj.title}" />`;
      wrap.appendChild(label);
    }
    qDiv.appendChild(wrap); container.appendChild(qDiv);
  }

  wireChoiceHighlighting(container);
  container.querySelectorAll("button[data-play]").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      const qid=btn.getAttribute("data-play"), audio=audioElByQ.get(qid), hint=container.querySelector(`[data-playhint="${qid}"]`);
      if(!audio) return; if(QUIZ_CONFIG.PLAY_ONCE_ONLY&&playedOnce.has(qid)) return;
      btn.disabled=true;
      try{
        audio.currentTime=0; await audio.play(); if(hint) hint.textContent="Listening…";
        audio.onended=()=>{ if(hint) hint.textContent="Done. Now choose an image."; if(QUIZ_CONFIG.PLAY_ONCE_ONLY){ playedOnce.add(qid); btn.textContent="Played"; btn.disabled=true; } else btn.disabled=false; };
      }catch(e){ if(hint) hint.textContent="Click again to play."; btn.disabled=false; }
    });
  });
  setStatus($("quizStatus"),"","");
}

function getStudent(){ return {firstName:$("firstName").value.trim(),lastName:$("lastName").value.trim(),email:$("email").value.trim(),gradeSection:$("gradeSection").value.trim()}; }

function computeResult(){
  const answers=[]; let score=0;
  for(const q of quizQuestions){
    const selected=document.querySelector(`input[name="${q.id}"]:checked`);
    const selectedTitle=selected?selected.value:"", isCorrect=selectedTitle===q.correctImageTitle;
    if(isCorrect) score++;
    answers.push({questionId:q.id,prompt:q.prompt,selectedImageTitle:selectedTitle,correctImageTitle:q.correctImageTitle,isCorrect});
  }
  return {score,total:quizQuestions.length,answers};
}

async function submitResults(){
  setStatus($("submitStatus"),"",""); $("submitBtn").disabled=true;
  for(const q of quizQuestions){
    if(!document.querySelector(`input[name="${q.id}"]:checked`)){
      setStatus($("submitStatus"),"Please answer every question before submitting.","err"); $("submitBtn").disabled=false; return;
    }
  }
  const payload={quizTitle:QUIZ_CONFIG.QUIZ_TITLE,submittedAtISO:new Date().toISOString(),student:getStudent(),result:computeResult(),userAgent:navigator.userAgent};
  $("scorePreview").textContent=`Score: ${payload.result.score} / ${payload.result.total}`;
  if(!GOOGLE_APPS_SCRIPT_WEB_APP_URL||GOOGLE_APPS_SCRIPT_WEB_APP_URL.includes("PASTE_YOUR")){
    setStatus($("submitStatus"),"Missing Google Apps Script Web App URL in index.html.","err"); $("submitBtn").disabled=false; return;
  }
  try{
    setStatus($("submitStatus"),"Submitting…","");
    await fetch(GOOGLE_APPS_SCRIPT_WEB_APP_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)});
    $("quizCard").classList.add("hidden"); $("doneCard").classList.remove("hidden");
    $("doneMsg").textContent=`Submitted! Score: ${payload.result.score} / ${payload.result.total}. A copy will be emailed to ${payload.student.email}.`;
    window.scrollTo(0,0);
  }catch(err){ setStatus($("submitStatus"),String(err.message||err),"err"); }
  finally{ $("submitBtn").disabled=false; }
}

async function startQuizFlow(e){
  e.preventDefault(); if(BUILDING)return; BUILDING=true; setStatus($("introStatus"),"",""); $("startBtn").disabled=true;
  try{ setStatus($("introStatus"),"Building quiz…",""); await buildQuizQuestions(); $("introCard").classList.add("hidden"); $("quizCard").classList.remove("hidden"); window.scrollTo(0,0); }
  catch(err){ setStatus($("introStatus"),String(err.message||err),"err"); $("startBtn").disabled=false; }
  finally{ BUILDING=false; }
}

function resetUIOnly(){
  setStatus($("introStatus"),"",""); setStatus($("quizStatus"),"",""); setStatus($("submitStatus"),"",""); $("doneMsg").textContent=""; $("scorePreview").textContent="";
  $("startBtn").disabled=false; $("submitBtn").disabled=false; $("questions").innerHTML=""; playedOnce.clear(); audioElByQ.clear();
  $("introCard").classList.remove("hidden"); $("quizCard").classList.add("hidden"); $("doneCard").classList.add("hidden"); window.scrollTo(0,0);
}

document.addEventListener("DOMContentLoaded",()=>{
  initializeQuizData();
  $("introForm").addEventListener("submit",startQuizFlow);
  $("resetBtn").addEventListener("click",resetUIOnly);
  $("doneResetBtn").addEventListener("click",resetUIOnly);
  $("submitBtn").addEventListener("click",submitResults);
});
</script>
</body>
</html>
